<template>
  <template if:true={banner}>
    <div class="banner">
      <div class="card">
        <p class="title">
          <span class="registrasi">Registrasi</span>
        </p>
        <p class="title">
          <span class="publisher">Publisher</span>
        </p>
        <p class="title">
          <span class="message">Mari berkolaborasi dan menjadi bagian dari ekosistem periklanan digital Indonesia
            Raya</span>
        </p>
        <div class="card-container">
          <div class="logo-title-container">
            <img src="https://api.microsite.id/assets/img/tadex_logo.png" alt="TADEX" class="logo">
            <p class="title-mobile mt-5">Registrasi Publisher</p>
          </div>
          <p class="message-mobile">Mari berkolaborasi dan menjadi bagian dari ekosistem periklanan digital Indonesia
          </p>

          <div class="card-button">
            <button class="modal-button" onclick={handleShowModal}> Informasi Selengkapnya </button>
            <button class="desktop-button" onclick={handleShowInformation}>Informasi Selengkapnya</button>
          </div>
        </div>
      </div>
      <img src="https://api.microsite.id/assets/img/tadex_form.png" class="imgbg">
    </div>
    <div class="tmfillform" align="left">
      <i>
        <p class="textfillform">Pengisian formulir ini akan membutuhkan waktu sekitar 6 menit</p>
      </i>
    </div>
    <div class="card-flow">
      <lightning-flow flow-api-name="Tadex_Form_Version_2" flow-input-variables={inputVariables}
        onstatuschange={handleStatusChange}></lightning-flow>
    </div>

    <template if:true={showModal}>
      <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
          <header class="slds-modal__header" style="border-radius: 20px !important;">
            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
              onclick={handleHideModal}>
              <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                size="small"></lightning-icon>
              <span class="slds-assistive-text">Close</span>
            </button>
            <p class="title-modal" align="center">Informasi Publisher</p>
            <p class="text-modal" align="center">TADEX bekerja sama dengan TASK Force Media Sustainability
              mempersembahkan platform periklanan programmatic Indonesia. <br><br>
              Media yang bisa bergabung adalah semua media yang telah memperoleh minimal veririkasi faktual dari Dewan
              Pers serta media online dari stasiun radio yang sudah memperoleh izin frekuensi dari pemerintah. <br><br>
              Distribusi pemasangan iklan melalui TADEX akan ditentukan secara programmatic berdasarkan demografi,
              bidang pekerjaan, bidang usaha, minat, dan profil tertentu lainnya dar tatrget audiens yang dituju.
              <br><br>
              Mari berkolaborasi dan menjadi bagian dari ekosistem periklanan digital Indonesia.
            </p>
          </header>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </template>

  <template if:true={info}>
    <div class="banner_info">
      <button class="slds-button slds-button_icon slds-button_icon-bare backbutton" title="Back" type="button"
        part="button button-icon" style="
            color: white;
        " onclick={handleBackInformation}>
        <svg class="slds-button__icon" style="width: 110px; height: 88px;" focusable="false" data-key="chevronleft"
          aria-hidden="true" viewBox="0 0 52 52" part="icon">
          <g>
            <path
              d="M34.2 47.7L13.4 27.2c-.6-.6-.6-1.6 0-2.2L34.2 4.5c.6-.6 1.6-.6 2.2 0l2.2 2.2c.6.6.6 1.6 0 2.2L22.1 25c-.6.6-.6 1.6 0 2.2l16.3 16.1c.6.6.6 1.6 0 2.2l-2.2 2.2c-.5.5-1.4.5-2 0z">
            </path>
          </g>
        </svg>
        <span class="slds-assistive-text">Back</span>
      </button>

      <div class="card_info">
        <p class="text-informasi">
          <u>Informasi Publisher</u>
        </p>
        <div class="paraghrap_info mt-5">
          <p align="center" style="color:white;">
            TADEX bekerja sama dengan TASK Force Media Sustainability mempersembahkan platform periklanan programmatic
            Indonesia.<br><br>
            Media yang bisa bergabung adalah semua media yang telah memperoleh minimal veririkasi faktual dari Dewan
            Pers serta media online dari stasiun radio yang sudah memperoleh izin frekuensi dari pemerintah.<br><br>
            Distribusi pemasangan iklan melalui TADEX akan ditentukan secara programmatic berdasarkan demografi, bidang
            pekerjaan, bidang usaha, minat, dan profil tertentu lainnya dar tatrget audiens yang dituju.<br><br>
            Mari berkolaborasi dan menjadi bagian dari ekosistem periklanan digital Indonesia.
          </p>
        </div>

      </div>

    </div>

  </template>
  <template if:true={successPage}>
    <div class="banner_info">

      <div class="card_success">
        <img class="icon_success" src={svgTick}></img>
        <p class="text_success">Registrasi Berhasil!</p><br>
        <p style="color: #000;
                    font-family: Poppins;
                    font-size: 22px;
                    font-style: normal;
                    font-weight: 600;
                    line-height: 32px; /* 145.455% */
                    letter-spacing: 0.1px;">Data Anda Tersimpan</p><br>
        <p style="color: #000;
                    text-align: center;
                    font-family: Poppins;
                    font-size: 23px;
                    font-style: normal;
                    font-weight: 400;
                    line-height: 32px; /* 139.13% */
                    letter-spacing: 0.1px;">Tim kami akan segera menghubungi Anda untuk informasi selanjutnya</p><br>
        <div class="container_email">
          <div class="image">
            <img src={imgEmail}>
          </div>
          <div class="text_email">
            <p>halo@tadex.id</p>
          </div>
        </div>

      </div>

    </div>
  </template>

</template>
