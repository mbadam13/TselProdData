<template>
    <lightning-card title="Invoice Settlement" icon-name="standard:partner_fund_claim">
        <!-- Loading spinner -->
        <template if:true={isLoading}>
            <div class="slds-is-relative">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>
        
        <!-- Filter Section -->
        <div class="slds-m-around_medium slds-grid slds-wrap slds-grid_vertical-align-center slds-m-top_medium">
            <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                <lightning-input type="date" label="Start Date" onchange={handleStartDateChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                <lightning-input type="date" label="End Date" onchange={handleEndDateChange}></lightning-input>
            </div>
        </div>
        

        <!-- Button Action -->
        <template if:true={canAccessButtons}>
            <div class="slds-m-around_medium slds-grid slds-wrap slds-grid_vertical-align-center">
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small">
                    <lightning-button label="Export to CSV" onclick={handleExport} class="slds-m-top_small"></lightning-button>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-p-horizontal_small  file-input-container">
                    <lightning-input type="file" label="Import CSV" onchange={handleFilesChange} accept=".csv" class="file-input"></lightning-input>
                    <label if:true={selectedFileName} class="slds-form-element__label file-name">{selectedFileName}</label>
                    <lightning-button label="Import" title="Import" onclick={importData} disabled={isImportButtonDisabled} class="slds-m-top_small"></lightning-button>
                </div>
            </div>
        </template>
        
        <!-- Data table -->
        <template if:true={records}>
            <div class="slds-m-around_medium">
                <lightning-datatable key-field="recordId" data={records} columns={columns} hide-checkbox-column="true"></lightning-datatable>
            </div>
        </template>
    </lightning-card>
</template>
