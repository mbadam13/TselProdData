<template>
    <lightning-card>
        <div if:true={isLoaded} class="cstm-spinner">
            <lightning-spinner alternative-text="Loading..."></lightning-spinner>
        </div>

        <div if:true={error}>
            {error}
        </div>

        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <lightning-Icon icon-name="standard:product" size="small"></lightning-Icon>
                </div>
                <div class="slds-media__body">
                    <h2>
                        <span class="slds-text-heading_small">Import Media Order Item by CSV File With Comma
                            Delimited</span>
                    </h2>
                </div>
            </header>
            <!--<div class="slds-no-flex">
                <lightning-button label="Download Example CSV File" onclick={handleExportRecordCsvFile}>
                </lightning-button>
            </div>-->
        </div>

        <div class="slds-m-around_medium">
            <lightning-file-upload accept={acceptedFormats} label="Upload File" onuploadfinished={handleUploadFinished}>
            </lightning-file-upload>
        </div>
    </lightning-card>
</template>
